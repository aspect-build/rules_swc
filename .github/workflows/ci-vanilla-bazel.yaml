name: CI - Vanilla Bazel

# Controls when the action will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Indicates where the aspect CLI should look for .aspect/config.json
  ASPECT_WORKSPACE: ${{ github.workspace }}

jobs:
  # Prepares dynamic test matrix values
  matrix-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: bazel-version
        name: Prepare 'bazel-version' matrix axis
        run: |
          v=$(head -n 1 .bazelversion)
          m=${v::1}
          a=(
            "major:$m, version:\"$v\""
          )
          printf -v j '{%s},' "${a[@]}"
          echo "res=[${j%,}]" | tee -a $GITHUB_OUTPUT
      - id: os
        name: Prepare 'os' matrix axis
        # Only run MacOS and Windows on main branch (not PRs) to minimize minutes (billed at 10X and 2X respectively)
        # https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions#included-storage-and-minutes
        # Full Linux test suite is handled by Aspect Workflows.
        run: |
          a=( ubuntu )
          if [[ "${{ github.ref_name }}" == "main" ]] || [[ "${{ github.head_ref }}" == *"macos"* ]]; then
            a+=( macos )
          fi
          if [[ "${{ github.ref_name }}" == "main" ]] || [[ "${{ github.head_ref }}" == *"windows"* ]]; then
            a+=( windows )
          fi
          printf -v j '"%s",' "${a[@]}"
          echo "res=[${j%,}]" | tee -a $GITHUB_OUTPUT
    outputs:
      bazel-version: ${{ steps.bazel-version.outputs.res }}
      os: ${{ steps.os.outputs.res }}

  # Smoke test on Ubuntu (all PRs) and full matrix on MacOS/Windows (main only).
  # Full Linux test suite (all folders, bzlmod variants, Bazel versions) is on Aspect Workflows.
  test:
    runs-on: ${{ matrix.os }}-latest
    needs:
      - matrix-prep
    defaults:
      run:
        working-directory: e2e/smoke
    strategy:
      fail-fast: false
      matrix:
        bazel-version: ${{ fromJSON(needs.matrix-prep.outputs.bazel-version) }}
        os: ${{ fromJSON(needs.matrix-prep.outputs.os) }}
    env:
      # Skip --config=aspect-cloud on Windows and fork PRs. The aspect CLI does
      # not support Windows, and fork PRs do not have access to secrets.
      BAZEL_ASPECT_FLAGS: ${{ matrix.os != 'windows' && secrets.ASPECT_OSS_API_TOKEN != '' && '--config=aspect-cloud' || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.bazel-version.version }}-${{ matrix.os }}-smoke
          repository-cache: true

      - uses: aspect-build/setup-aspect@b1e9d142e86f63c10d603304daa22bf80492e24c # v2026.25.1
        if: matrix.os != 'windows'
        with:
          aspect-api-token: ${{ secrets.ASPECT_OSS_API_TOKEN }}
          disk-cache: false
          repository-cache: false

      # Bazel fails the build rather than create the directory the
      # aspect-exec-log group writes into.
      - run: mkdir -p .aspect/generated
        shell: bash

      - name: bazel test //...
        shell: bash
        run: |
          bazel test ${{ env.BAZEL_ASPECT_FLAGS }} \
            --test_tag_filters=-skip-on-bazel${{ matrix.bazel-version.major }} \
            --build_tag_filters=-skip-on-bazel${{ matrix.bazel-version.major }} \
            //...
